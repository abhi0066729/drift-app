name: Build iOS IPA (Unsigned)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🏗 Build IPA (Unsigned)
        run: |
          npx expo prebuild --platform ios
          npx expo run:ios --configuration Release --no-install --destination "generic/platform=iOS"
          mkdir -p Payload
          mv ios/build/Build/Products/Release-iphoneos/drift-app.app Payload/
          zip -r drift-palace-unsigned.ipa Payload
          rm -rf Payload

      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-palace-ios-ipa
          path: drift-palace-unsigned.ipa
