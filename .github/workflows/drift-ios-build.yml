name: Build iOS IPA (Unsigned)
on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:

  build:
    runs-on: macos-latest
    steps:
      - name: 🏗 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm install

      - name: 🚀 Setup Expo
        uses: expo/expo-github-action@v8
        with:
          expo-version: latest
          eas-cache: true

      - name: 🛠 Prebuild Native Modules
        run: npx expo prebuild --platform ios --no-install

      - name: 🍎 Install CocoaPods
        run: cd ios && pod install

      - name: 🏗 Build IPA (Unsigned)
        run: |
          npx xcodebuild -workspace ios/driftapp.xcworkspace -scheme driftapp -configuration Release -sdk iphoneos -derivedDataPath build
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/drift-app.app Payload/
          zip -r drift-palace-unsigned.ipa Payload
          rm -rf Payload


      - name: 📤 Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: drift-palace-ios-ipa
          path: drift-palace-unsigned.ipa
