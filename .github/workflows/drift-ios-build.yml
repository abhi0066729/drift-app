name: Build iOS IPA (Unsigned)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Specifically target Sonoma to avoid general runner outages
    steps:
      - name: 🏗 Checkout
        uses: actions/checkout@v4

      - name: 🛠 Pure Bash Setup
        run: |
          export PATH="/usr/local/bin:$PATH"
          brew install node@20
          npm install -g expo-cli
          npm install

      - name: 🛠 Prebuild & Pods
        run: |
          npx expo prebuild --platform ios --no-install
          cd ios && pod install

      - name: 🏗 Build IPA (Unsigned)
        run: |
          npx xcodebuild -workspace ios/driftapp.xcworkspace \
            -scheme driftapp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          mkdir -p Payload
          mv build/Build/Products/Release-iphoneos/drift-app.app Payload/
          zip -r drift-palace-unsigned.ipa Payload
