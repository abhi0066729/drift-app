workflows:
  ios-build-unsigned:
    name: Drift Palace iOS (Unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 24
      xcode: latest
    scripts:
      - name: Install system dependencies
        script: brew install vips
      - name: Install dependencies
        script: npm install
      - name: Expo Prebuild
        script: npx expo prebuild --platform ios --no-install
      - name: Install CocoaPods
        script: cd ios && pod install
      - name: Build Unsigned IPA
        script: |
          set -e # Stop on error
          # Expo prebuild uses the "name" field from app.json for the workspace name
          xcodebuild build -workspace ios/Drift.xcworkspace \
            -scheme Drift \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES
          
          mkdir -p Payload
          # Use wildcard to find the .app regardless of exact naming
          cp -R build/Build/Products/Release-iphoneos/*.app Payload/
          zip -r drift-palace-unsigned.ipa Payload

    artifacts:
      - "*.ipa"

  android-build:
    name: Drift Palace Android APK
    max_build_duration: 60
    instance_type: linux
    environment:
      node: 24
    scripts:
      - name: Install system dependencies
        script: sudo apt-get update && sudo apt-get install -y libvips-dev
      - name: Install dependencies
        script: npm install
      - name: Build APK
        script: npx expo export --platform android
    artifacts:
      - dist/*.apk
